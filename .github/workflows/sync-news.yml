name: Sync engineering news

on:
  schedule:
    # 06:00 e 14:00 ora Italia in ORA LEGALE (CEST = UTC+2, in vigore da fine
    # marzo a fine ottobre). GitHub Actions non converte automaticamente per
    # i cambi ora legale/solare: quando torna l'ora solare (fine ottobre,
    # CET = UTC+1) questi orari slitteranno di un'ora avanti (07:00/15:00)
    # finché non li aggiorni manualmente a "0 5 * * *" e "0 13 * * *".
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # bottone "Run workflow" per la sincronizzazione manuale

permissions:
  contents: write

concurrency:
  group: sync-engineering-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          LLM_PROVIDER: gemini
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python fetch_news.py

      - name: Commit updated news.json and flash.json
        run: |
          git config user.name "openmind-news-bot"
          git config user.email "openmind-news-bot@users.noreply.github.com"
          git add docs/news.json docs/flash.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico notizie [skip ci]"
          git push
